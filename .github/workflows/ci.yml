name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Format, analyze, and Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            example/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Test Android artifact verifier
        run: python3 -m unittest discover -s test/build -v

      - name: Verify native bundle contract
        run: python3 tool/verify_android_bundle.py android/src/main/jniLibs/arm64-v8a --require-provenance

      - name: Test native bridge and host FFI fixtures
        run: tool/test_native.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Analyze
        run: flutter analyze

      - name: Build Android arm64 APK and AAB
        working-directory: example
        run: |
          flutter build apk --release --target-platform android-arm64
          flutter build appbundle --release --target-platform android-arm64

      - name: Verify packaged native libraries and 16 KiB APK alignment
        run: |
          python3 tool/verify_android_bundle.py example/build/app/outputs/flutter-apk/app-release.apk --require-provenance
          python3 tool/verify_android_bundle.py example/build/app/outputs/bundle/release/app-release.aab --require-provenance
